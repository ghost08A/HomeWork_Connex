<!--
  layout ของ label กับ input
  col (default) = label บน input ล่าง
  row           = label ซ้าย input ขวา
  bottom        = label ล่าง input บน
-->
<div [class]="layout === 'row'
    ? 'flex flex-row items-center gap-4 w-full'
    : labelPosition === 'bottom'
        ? 'flex flex-col-reverse w-full'
        : 'w-full'">

  <!-- Label -->
  <div class="flex flex-row justify-between">
    @if (label) {
      <label
        [style.font-size.px]="fontSize"
        [class]="layout === 'row'
          ? 'whitespace-nowrap lyt-label'
          : labelPosition === 'bottom'
            ? 'block mt-1 lyt-label'
            : 'block mb-1 lyt-label'">
        {{ label }}
        @if (isRequired) {
          <span class="text-red-500">*</span>
        }
      </label>
    }
  </div>

  <!--
    dx-radio-group
    layout   = บอกว่าปุ่ม radio เรียงยังไง (horizontal/vertical)
    value    = ค่าที่เลือกอยู่ตอนนี้
    disabled = ปิดทุกปุ่มพร้อมกัน
  -->
  <dx-radio-group
    [dataSource]="dataSource"
    [displayExpr]="displayExpr"
    [valueExpr]="valueExpr"
    [value]="uiValue"
    [layout]="itemLayout"
    [disabled]="isDisabled"
    (onValueChanged)="onValueChange($event.value)"
    (onClick)="onItemClick($event)">
  </dx-radio-group>

  <!-- Error messages — เหมือนทุก component -->
  @if (attributeName && componentState.getError(attributeName).length > 0) {
    <div class="text-red-500 text-xs mt-1 flex flex-col gap-0.5 animate-fadeIn">
      @for (errorMsg of componentState.getError(attributeName); track $index) {
        <div class="flex items-center gap-1">
          <span class="inline-block w-1 h-1 bg-red-500 rounded-full"></span>
          <span>{{ errorMsg }}</span>
        </div>
      }
    </div>
  }

</div>
