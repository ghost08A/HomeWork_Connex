<div class="order-Lists">
  <div class="order-Lists-header">
    <h1 class="header-title">Order Lists</h1>
    <hr class="divider" />
  </div>
  @if (loadingService.isLoading() === false) {
    <div class="filter-card">
      <div class="filter-grid">
        <!-- Left Column: Search & Status Checkboxes -->
        <div class="filter-col">
          <custom-input
            type="Text"
            label="ค้นหาคำสั่งซื้อ"
            placeholder="พิมพ์ค้นหาคำสั่งซื้อ..."
            [(fieldValue)]="searchKeyword"
          ></custom-input>

          <div class="checkbox-group" style="margin-top: 16px">
            <!-- Using Checkbox Group for Status exactly as Product uses individual Checkboxes -->
            <custom-checkbox-group
              label="สถานะ"
              [dataSource]="statusOptions"
              [(fieldValue)]="selectedStatus"
              [columns]="3"
            ></custom-checkbox-group>
          </div>
        </div>

        <!-- Right Column: Products TagBox, Date Range, Action Buttons -->
        <div class="filter-col-spaced">
          <custom-tag-box
            label="สินค้า"
            placeholder="เลือกสินค้า (สามารถเลือกได้หลายค่า)"
            [dataSource]="productOptions"
            [(fieldValue)]="selectedProducts"
            [showSelectionControls]="true"
            [applyValueMode]="'useButtons'"
            [searchEnabled]="true"
          ></custom-tag-box>

          <div class="flex items-center gap-2 mt-4">
            <div class="w-full">
              <custom-input
                type="Date"
                label="วันที่เบิก (เริ่มต้น)"
                placeholder="Start Date"
                [(fieldValue)]="startDate"
              >
              </custom-input>
            </div>
            <span class="text-gray-400 font-medium" style="margin-top: 24px">-</span>
            <div class="w-full">
              <custom-input
                type="Date"
                label="วันที่เบิก (สิ้นสุด)"
                placeholder="End Date"
                [(fieldValue)]="endDate"
              >
              </custom-input>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="action-buttons-group">
            <custom-button
              text="Clear"
              type="normal"
              stylingMode="outlined"
              (onClick)="onClear()"
            ></custom-button>
            <custom-button
              text="Search"
              type="default"
              stylingMode="contained"
              (onClick)="onSearch()"
            ></custom-button>
          </div>
        </div>
      </div>
    </div>

    <hr class="divider mb-2" />
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-2">
      <div class="flex flex-wrap items-center gap-4 px-4 py-2 text-sm text-gray-700">
        <div class="flex items-center gap-1.5">
          <i class="dx-icon-checkmarkcircle text-green-600 text-lg"></i>
          <span>สถานะ Submit</span>
        </div>

        <div class="flex items-center gap-1.5">
          <i class="dx-icon-edit text-blue-600 text-lg"></i>
          <span>แก้ไข</span>
        </div>

        <div class="flex items-center gap-1.5">
          <i class="dx-icon-trash text-red-500 text-lg"></i>
          <span>ลบรายการ</span>
        </div>
      </div>

      <div>
        <custom-button
          text="เพิ่มออเดอร์"
          icon="plus"
          type="success"
          stylingMode="contained"
          (onClick)="onAddNewOrder()"
        >
        </custom-button>
      </div>
    </div>
  }
  <custom-data-grid
    #dataGrid
    [dataSource]="gridDataSource"
    keyExpr="orderId"
    [columns]="masterColumns"
    [actionButtons]="actionButtons"
    actionColumnCaption="จัดการ"
    [actionColumnWidth]="200"
    [pageSize]="10"
    [remoteOperations]="true"
    [hasDetailRow]="true"
    [masterDetailTemplate]="orderDetailTemplate"
  />
</div>

<ng-template #orderDetailTemplate let-data>
  <div class="p-4 bg-gray-50 rounded-lg border border-gray-200 shadow-inner">
    <div class="mb-3">
      <h3 class="text-sm font-bold text-gray-700">
        รายการสินค้าที่เบิก (รหัสบิล: {{ data.orderId }})
      </h3>
    </div>

    <custom-data-grid
      [dataSource]="data.products"
      keyExpr="productId"
      [columns]="detailColumns"
      [showSearchPanel]="false"
      [showPager]="false"
      [remoteOperations]="false"
    >
    </custom-data-grid>
  </div>
</ng-template>

<ng-template #statusTemplate let-status>
  <span
    [class]="
      status.data.status === 'Approved'
        ? 'text-green-600 font-semibold'
        : 'text-red-600 font-semibold'
    "
  >
    {{ status.data.status }}
  </span>
</ng-template>
