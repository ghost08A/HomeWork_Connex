<div class="min-h-screen px-8 py-6 bg-gray-50">
  <!-- Header Section -->
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Product Dashboard</h1>
    <hr class="mt-4 border-gray-300" />
  </div>

  <!-- Search & Filter Card -->
  <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Left Column: Search & Checkboxes -->
      <div class="flex flex-col gap-4">
        <app-custom-input
          type="Text"
          label="ค้นหาสินค้า"
          placeholder="พิมพ์ชื่อสินค้าที่ต้องการค้นหา..."
          [(fieldValue)]="searchKeyword"
          (fieldValueChange)="applyFilters()"
        >
        </app-custom-input>
        <div class="flex flex-row gap-6 mt-2">
          <custom-checkbox
            label="Active"
            [(fieldValue)]="filterActive"
            (fieldValueChange)="applyFilters()"
          />
          <custom-checkbox
            label="Inactive"
            [(fieldValue)]="filterInactive"
            (fieldValueChange)="applyFilters()"
          />
        </div>
      </div>

      <!-- Right Column: Tag Box & Buttons -->
      <div class="flex flex-col justify-between gap-4">
        <custom-tag-box
          label="ประเภทสินค้า"
          [dataSource]="categoryOptions"
          [(fieldValue)]="selectedCategories"
          (fieldValueChange)="applyFilters()"
          [showSelectionControls]="true"
          [applyValueMode]="'useButtons'"
          [searchEnabled]="true"
          placeholder="เลือกประเภทสินค้า (สามารถเลือกได้หลายค่า)"
        />

        <!-- Action Buttons -->
        <div class="flex justify-end gap-3 mt-auto pt-4">
          <custom-button
            text="เพิ่มสินค้า"
            icon="plus"
            type="success"
            stylingMode="contained"
            (onClick)="onAddProduct()"
          >
          </custom-button>

          <custom-button
            text="ค้นหา"
            icon="search"
            type="default"
            stylingMode="contained"
            (onClick)="applyFilters()"
          >
          </custom-button>
        </div>
      </div>
    </div>
  </div>
  <custom-data-grid
    [dataSource]="filteredProducts"
    keyExpr="productId"
    [columns]="columns"
    [actionButtons]="actionButtons"
    actionColumnCaption="จัดการ"
    [actionColumnWidth]="200"
    [hasDetailRow]="true"
    [masterDetailTemplate]="productDetailTemplate"
    [showSearchPanel]="false"
    [pageSize]="10"
    (rowClick)="onRowClick($event)"
  >
    <!-- Template สถานะ -->
    <ng-template #statusTemplate let-cell>
      <span
        [class]="
          cell.data.statusProductCode === 'ACTIVE'
            ? 'text-green-600 font-semibold'
            : 'text-red-600 font-semibold'
        "
      >
        {{ cell.data.statusProductCode }}
      </span>
    </ng-template>

    <!-- Detail Row — แสดง price, detail, quantity, image -->
    <ng-template #productDetailTemplate let-data>
      <div class="p-4 bg-gray-50 flex flex-row gap-6">
        <!-- รูปสินค้า -->
        <img
          [src]="data.imagePath"
          [alt]="data.productName"
          class="w-32 h-32 object-cover rounded shadow"
        />

        <!-- ข้อมูล detail -->
        <div class="flex flex-col gap-2">
          <p class="font-semibold text-lg">{{ data.productName }}</p>
          <p class="text-sm text-gray-600">{{ data.detail }}</p>
          <div class="flex flex-row gap-6 mt-2">
            <div>
              <span class="text-xs text-gray-400">ราคา</span>
              <p class="font-semibold text-blue-600">{{ data.price | number: '1.2-2' }} บาท</p>
            </div>
            <div>
              <span class="text-xs text-gray-400">จำนวนคงเหลือ</span>
              <p
                class="font-semibold"
                [class.text-red-500]="data.quantity === 0"
                [class.text-green-600]="data.quantity > 0"
              >
                {{ data.quantity }} ชิ้น
              </p>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </custom-data-grid>
</div>
