<div class="register-container">
  
  <div class="register-card">
    
    <div class="register-header">
      <h2 class="register-title">สร้างบัญชีใหม่</h2>
      <p class="register-description">กรุณากรอกข้อมูลเพื่อลงทะเบียนเข้าสู่ใช้งานระบบ</p>
    </div>

      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
        
        <div class="md:col-span-2">
          <app-custom-input
            type="Text"
            label="Username (ชื่อผู้ใช้งาน)"
            placeholder="ระบุ Username สำหรับเข้าสู่ระบบ"
            attributeName="username"
            [isRequired]="true"
            [componentState]="registerState"
            [(fieldValue)]="formData.username">
           
          </app-custom-input>
        </div>

        <app-custom-input
          type="Password"
          label="Password (รหัสผ่าน)"
          placeholder="ตั้งรหัสผ่านของคุณ"
          attributeName="password"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.password">
        </app-custom-input>

        <app-custom-input
          type="Password"
          label="Confirm Password (ยืนยันรหัสผ่าน)"
          placeholder="กรอกรหัสผ่านอีกครั้ง"
          attributeName="confirmPassword"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.confirmPassword">
        </app-custom-input>

        <app-custom-input
          type="Text"
          label="Firstname (ชื่อจริง)"
          placeholder="ระบุชื่อจริงภาษาไทยหรืออังกฤษ"
          attributeName="firstname"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.firstName">
        </app-custom-input>

        <app-custom-input
          type="Text"
          label="Lastname (นามสกุล)"
          placeholder="ระบุนามสกุล"
          attributeName="lastname"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.lastName">
        </app-custom-input>

        <app-custom-input
          type="Number"
          label="Age (อายุ)"
          placeholder="ระบุอายุเป็นตัวเลข"
          attributeName="age"
          [min]="1"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.age">
        </app-custom-input>

        <app-custom-input
          type="Phone"
          label="Phone (เบอร์โทรศัพท์)"
          placeholder="เช่น 0900000000"
          attributeName="phone"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.phone">
        </app-custom-input>

        <div class="md:col-span-2">
          <app-custom-input
            type="Date"
            label="BirthDate (วัน/เดือน/ปี เกิด)"
            placeholder="เลือกวันเกิดของคุณ (ไม่จำเป็น)"
            attributeName="birthDate"
            [isRequired]="false"
            [componentState]="registerState"
            [(fieldValue)]="formData.birthDate">
          </app-custom-input>
        </div>

      </div>

      <div class="flex flex-col sm:flex-row gap-3 mt-8">
        
        <div class="w-full sm:w-1/3">
          <custom-button
            text="ย้อนกลับ"
            type="normal"
            stylingMode="outlined"
            width="100%"
            (onClick)="onBackToLogin()">
          </custom-button>
        </div>

        <div class="w-full sm:w-2/3">
          <custom-button
            text="ลงทะเบียนสมาชิก"
            type="default"
            stylingMode="contained"
            width="100%"
            (onClick)="onRegisterSubmit()">
          </custom-button>
        </div>
      </div>
  </div>
</div>
