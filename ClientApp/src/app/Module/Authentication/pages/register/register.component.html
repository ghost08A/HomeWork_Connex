<div class="min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 p-6">
  
  <div class="w-full max-w-2xl bg-white p-8 rounded-2xl shadow-2xl border border-slate-50">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-black text-slate-800 tracking-tight">สร้างบัญชีใหม่</h2>
      <p class="text-slate-400 mt-1 text-sm font-light">กรุณากรอกข้อมูลเพื่อลงทะเบียนเข้าสู่ใช้งานระบบ</p>
    </div>

    <dx-validation-group #registerGroup>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
        
        <div class="md:col-span-2">
          <app-custom-input
            type="Text"
            label="Username (ชื่อผู้ใช้งาน)"
            placeholder="ระบุ Username สำหรับเข้าสู่ระบบ"
            attributeName="username"
            [isRequired]="true"
            [componentState]="registerState"
            [(fieldValue)]="formData.Username">
           
          </app-custom-input>
        </div>

        <app-custom-input
          type="Password"
          label="Password (รหัสผ่าน)"
          placeholder="ตั้งรหัสผ่านของคุณ"
          attributeName="password"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.Password">
        </app-custom-input>

        <app-custom-input
          type="Password"
          label="Confirm Password (ยืนยันรหัสผ่าน)"
          placeholder="กรอกรหัสผ่านอีกครั้ง"
          attributeName="confirmpassword"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.ConfirmPassword">
        </app-custom-input>

        <app-custom-input
          type="Text"
          label="Firstname (ชื่อจริง)"
          placeholder="ระบุชื่อจริงภาษาไทยหรืออังกฤษ"
          attributeName="firstname"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.FirstName">
        </app-custom-input>

        <app-custom-input
          type="Text"
          label="Lastname (นามสกุล)"
          placeholder="ระบุนามสกุล"
          attributeName="lastname"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.LastName">
        </app-custom-input>

        <app-custom-input
          type="Number"
          label="Age (อายุ)"
          placeholder="ระบุอายุเป็นตัวเลข"
          attributeName="age"
          [min]="1"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.Age">
        </app-custom-input>

        <app-custom-input
          type="Phone"
          label="Phone (เบอร์โทรศัพท์)"
          placeholder="เช่น 0900000000"
          attributeName="phone"
          [isRequired]="true"
          [componentState]="registerState"
          [(fieldValue)]="formData.Phone">
        </app-custom-input>

        <div class="md:col-span-2">
          <app-custom-input
            type="Date"
            label="BirthDate (วัน/เดือน/ปี เกิด)"
            placeholder="เลือกวันเกิดของคุณ (ไม่จำเป็น)"
            attributeName="birthdate"
            [isRequired]="false"
            [componentState]="registerState"
            [(fieldValue)]="formData.BirthDate">
          </app-custom-input>
        </div>

      </div>

      <div class="flex flex-col sm:flex-row gap-3 mt-8">
        
        <div class="w-full sm:w-1/3">
          <app-custom-button
            text="ย้อนกลับ"
            type="normal"
            stylingMode="outlined"
            width="100%"
            (onClick)="onBackToLogin($event)">
          </app-custom-button>
        </div>

        <div class="w-full sm:w-2/3">
          <app-custom-button
            text="ลงทะเบียนสมาชิก"
            type="default"
            stylingMode="contained"
            width="100%"
            (onClick)="onRegisterSubmit($event)">
          </app-custom-button>
        </div>

      </div>

    </dx-validation-group>
  </div>
</div>
