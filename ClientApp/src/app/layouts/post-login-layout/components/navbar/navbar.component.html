<nav class="main-navbar">
  <div class="navbar-logo">
    <span class="logo-text">Connex</span>
  </div>

  <div class="navbar-actions">

    <div class="mobile-menu-toggle">
      <app-custom-button
        icon="menu"
        text=""
        stylingMode="text"
        (onClick)="toggleMobileMenu()">
      </app-custom-button>
    </div>

    <div class="desktop-menu">
      <div class="desktop-nav-container">
        
        <div class="desktop-links">
          @for (item of sortedMenuItems; track item.pageURL) {
            <a 
              [routerLink]="'/' + item.pageURL" 
              routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: true }"
              class="desktop-menu-item">
              {{ item.navbarName }} 
            </a>
          }
        </div>

        <div class="desktop-logout">
          <app-custom-button
            text="ออกจากระบบ"
            type="danger"
            stylingMode="outlined"
            [width]="110"
            (onClick)="onLogout()">
          </app-custom-button>
        </div>

      </div>
    </div>
  </div>
</nav>

@if (isMobileMenuOpen) {
  <div class="mobile-menu-panel">
    <div class="menu-links">
      @for(item of sortedMenuItems; track item.pageURL) {
       <button 
         class="mobile-menu-item"
         [routerLink]="'/' + item.pageURL"
         (click)="toggleMobileMenu()">
        {{ item.navbarName }}
       </button>
      }
    </div>

    <div class="mobile-logout-wrapper">
      <app-custom-button
        text="ออกจากระบบ"
        type="danger"
        stylingMode="outlined"
        width="100%"
        (onClick)="onLogout()">
      </app-custom-button>
    </div>
  </div>
}
